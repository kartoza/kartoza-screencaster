<!--
  Kartoza slant-title background. Subtle diagonal brand bands in the Kartoza
  palette, designed to sit under a translucent overlay in the docs hero
  (see .kz-hero in docs/stylesheets/extra.css). Vector so it scales crisply.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Kartoza brand slant background">
  <defs>
    <linearGradient id="kzFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54A2CC" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#54A2CC" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="500" fill="#F5F5F2"/>
  <rect width="1600" height="500" fill="url(#kzFade)"/>
  <!-- Diagonal slant bands (skewed via transform) -->
  <g transform="skewX(-18)">
    <rect x="-200"  y="-80" width="150" height="700" fill="#54A2CC" opacity="0.10"/>
    <rect x="60"    y="-80" width="90"  height="700" fill="#EEB348" opacity="0.10"/>
    <rect x="260"   y="-80" width="220" height="700" fill="#54A2CC" opacity="0.06"/>
    <rect x="1180"  y="-80" width="120" height="700" fill="#EEB348" opacity="0.08"/>
    <rect x="1360"  y="-80" width="260" height="700" fill="#54A2CC" opacity="0.08"/>
  </g>
</svg>
