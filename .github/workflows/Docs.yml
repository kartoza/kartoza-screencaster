name: 📚 Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/Docs.yml'
  workflow_dispatch:

# Allow only one concurrent deploy, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-revision dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install mkdocs, plugins and doxygen
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-glightbox \
            mkdocs-git-revision-date-localized-plugin \
            pymdown-extensions
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen API reference
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile

      - name: Build mkdocs site (strict)
        run: |
          mkdocs build --strict --site-dir site

      - name: Merge Doxygen HTML into site/api/
        run: |
          rm -rf site/api
          cp -r build/doxygen/html site/api

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
