# SPDX-License-Identifier: MIT
#
# Builds the MkDocs site (with the brand pack) and the Doxygen C++ API
# reference, merges them into a single output, and deploys to GitHub
# Pages on every push to main.
#
# Everything runs through the project flake — no pip, no apt installs.
# `nix run .#docs-full-build` is the same command developers use locally
# and produces byte-identical output.
name: 📚 Docs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'Doxyfile'
      - 'src/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/Docs.yml'
  workflow_dispatch:

# Allow only one concurrent deploy, but don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site (Nix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git-revision dates)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      - name: Build merged docs (MkDocs strict + Doxygen + /api/ merge)
        run: nix run .#docs-full-build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
