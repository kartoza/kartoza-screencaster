name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  version-check:
    name: Verify CMakeLists.txt version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version match
        run: |
          TAG="${{ github.ref_name || github.event.inputs.tag }}"
          TAG_VERSION="${TAG#v}"
          CMAKE_VERSION=$(grep -oP 'project\(kartoza-screencaster VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "Tag version:   $TAG_VERSION"
          echo "CMake version: $CMAKE_VERSION"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "::error::Version mismatch! Tag is $TAG_VERSION but CMakeLists.txt has $CMAKE_VERSION"
            echo "Update the version in CMakeLists.txt line 2 to match the release tag."
            exit 1
          fi
          echo "Versions match."

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-24.04
    needs: version-check
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev qt6-wayland-dev libgl1-mesa-dev
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          strip build/kartoza-screencaster
      - name: Package
        run: |
          mkdir -p release
          cp build/kartoza-screencaster release/
          cp resources/kartoza-screencaster.desktop release/
          cp resources/icon_ready.svg release/kartoza-screencaster.svg
          cd release && tar -czf ../kartoza-screencaster-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: kartoza-screencaster-linux-x86_64.tar.gz

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt6 cmake ninja ffmpeg
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$(brew --prefix qt6)
          cmake --build build -j$(sysctl -n hw.logicalcpu)
          strip build/kartoza-screencaster
      - name: Package
        run: |
          mkdir -p release
          cp build/kartoza-screencaster release/
          cd release && tar -czf ../kartoza-screencaster-macos-arm64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: kartoza-screencaster-macos-arm64.tar.gz

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtmultimedia'
          arch: 'win64_msvc2019_64'
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: |
          cmake -B build -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Package
        shell: bash
        run: |
          mkdir -p release
          cp build/kartoza-screencaster.exe release/
          cd release && 7z a ../kartoza-screencaster-windows-x86_64.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: kartoza-screencaster-windows-x86_64.zip

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-24.04
    needs: [version-check, build-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build dpkg-dev \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev qt6-wayland-dev libgl1-mesa-dev
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.tag }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
      - name: Build & Package
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          strip build/kartoza-screencaster
          VER=${{ steps.version.outputs.version }}
          mkdir -p dpkg/{DEBIAN,usr/bin,usr/share/applications,usr/share/icons/hicolor/scalable/apps}
          cp build/kartoza-screencaster dpkg/usr/bin/
          cp resources/kartoza-screencaster.desktop dpkg/usr/share/applications/
          cp resources/icon_ready.svg dpkg/usr/share/icons/hicolor/scalable/apps/kartoza-screencaster.svg
          cat > dpkg/DEBIAN/control << EOF
          Package: kartoza-screencaster
          Version: ${VER}
          Section: video
          Priority: optional
          Architecture: amd64
          Depends: ffmpeg,
                   libqt6core6 | libqt6core6t64,
                   libqt6gui6 | libqt6gui6t64,
                   libqt6widgets6 | libqt6widgets6t64,
                   libqt6multimedia6,
                   libqt6dbus6 | libqt6dbus6t64,
                   libqt6svg6,
                   libqt6network6 | libqt6network6t64,
                   qt6-wayland,
                   xdg-desktop-portal,
                   pipewire,
                   gstreamer1.0-tools,
                   gstreamer1.0-plugins-base,
                   gstreamer1.0-plugins-good,
                   gstreamer1.0-plugins-bad,
                   gstreamer1.0-libav,
                   gstreamer1.0-pipewire,
                   x11-xserver-utils
          Recommends: wl-screenrec,
                      grim,
                      xdg-desktop-portal-gnome | xdg-desktop-portal-kde
          Maintainer: Tim Sutton <tim@kartoza.com>
          Homepage: https://github.com/kartoza/kartoza-screencaster
          Description: Screen recording with WYSIWYG canvas editor
           Records the screen on Linux (X11 or Wayland), macOS, and Windows.
           Composes screen, webcam, logos and intro/outro sounds on a
           WYSIWYG canvas so the recorded MP4 is ready to publish — no
           post-production needed. One-click YouTube upload included.
          EOF
          dpkg-deb --build dpkg kartoza-screencaster_${VER}_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'

  build-rpm:
    name: Build RPM Package
    runs-on: ubuntu-24.04
    needs: [version-check, build-linux]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build rpm \
            qt6-base-dev qt6-multimedia-dev libqt6svg6-dev qt6-wayland-dev libgl1-mesa-dev
      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name || github.event.inputs.tag }}"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
      - name: Build & Package
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          strip build/kartoza-screencaster
          VER=${{ steps.version.outputs.version }}
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          DATE=$(date '+%a %b %d %Y')
          cat > rpmbuild/SPECS/kartoza-screencaster.spec << EOF
          Name:           kartoza-screencaster
          Version:        ${VER}
          Release:        1%{?dist}
          Summary:        Screen recording with WYSIWYG canvas editor
          License:        MIT
          URL:            https://github.com/kartoza/kartoza-screencaster
          Requires:       ffmpeg
          Requires:       qt6-qtbase qt6-qtbase-gui qt6-qtmultimedia qt6-qtsvg qt6-qtnetworkauth
          Requires:       xdg-desktop-portal
          Requires:       pipewire pipewire-gstreamer
          Requires:       gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good
          Requires:       gstreamer1-plugins-bad-free gstreamer1-libav
          Requires:       xorg-x11-server-utils
          Recommends:     wl-screenrec
          Recommends:     grim
          Recommends:     xdg-desktop-portal-gnome
          %description
          Records the screen on Linux (X11 or Wayland), macOS, and Windows.
          Composes screen, webcam, logos and intro/outro sounds on a
          WYSIWYG canvas so the recorded MP4 is ready to publish — no
          post-production needed. One-click YouTube upload included.
          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/scalable/apps
          cp $(pwd)/build/kartoza-screencaster %{buildroot}/usr/bin/
          cp $(pwd)/resources/kartoza-screencaster.desktop %{buildroot}/usr/share/applications/
          cp $(pwd)/resources/icon_ready.svg %{buildroot}/usr/share/icons/hicolor/scalable/apps/kartoza-screencaster.svg
          %files
          %attr(755, root, root) /usr/bin/kartoza-screencaster
          /usr/share/applications/kartoza-screencaster.desktop
          /usr/share/icons/hicolor/scalable/apps/kartoza-screencaster.svg
          %changelog
          * ${DATE} Tim Sutton <tim@kartoza.com> - ${VER}-1
          - Release ${VER}
          EOF
          rpmbuild --define "_topdir $(pwd)/rpmbuild" --define "_rpmdir $(pwd)" \
                   -bb rpmbuild/SPECS/kartoza-screencaster.spec
          mv x86_64/*.rpm .
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: '*.rpm'

  upload-release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, build-deb, build-rpm]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect and checksum
        run: |
          mkdir -p release
          cp artifacts/linux-x86_64/*.tar.gz release/
          cp artifacts/macos-arm64/*.tar.gz release/
          cp artifacts/windows-x86_64/*.zip release/
          cp artifacts/deb-package/*.deb release/
          cp artifacts/rpm-package/*.rpm release/
          cd release && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
