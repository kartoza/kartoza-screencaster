# SPDX-License-Identifier: MIT
site_name: Kartoza Screencaster
site_description: A Qt-based screen recorder for Linux, macOS and Windows with WYSIWYG canvas editor and one-click YouTube upload.
site_url: https://kartoza.github.io/kartoza-screencaster/
site_author: Kartoza
copyright: >
  &copy; Kartoza — Made with 💗 by
  <a href="https://kartoza.com">Kartoza</a>
  &middot; <a href="https://github.com/sponsors/kartoza">Donate</a>
  &middot; <a href="https://github.com/kartoza/kartoza-screencaster">GitHub</a>

repo_url: https://github.com/kartoza/kartoza-screencaster
repo_name: kartoza/kartoza-screencaster
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  # Kartoza brand assets — drop a real logo + favicon under
  # docs/assets/brand/ to replace the Material defaults.
  # logo: assets/brand/kartoza-symbol-color.svg
  # favicon: assets/brand/favicon.png
  font:
    text: Nunito
    code: JetBrains Mono
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    edit: material/file-edit-outline
    view: material/eye-outline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kartoza/kartoza-screencaster
      name: GitHub repository
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/kartoza
      name: Sponsor on GitHub
  generator: false

extra_css:
  - stylesheets/kartoza-tokens.css
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds: {case: lower}
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: en
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
      strict: false

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Install: getting-started/install.md
    - First recording: getting-started/first-recording.md
  - User Guide:
    - user-guide/index.md
    - Canvas editor: user-guide/canvas.md
    - Recording: user-guide/recording.md
    - Webcam overlay: user-guide/webcam.md
    - Logos and GIFs: user-guide/overlays.md
    - Audio: user-guide/audio.md
    - History and playback: user-guide/history.md
    - YouTube upload: user-guide/youtube.md
  - Administrator Guide:
    - admin-guide/index.md
    - Packaging: admin-guide/packaging.md
    - System dependencies: admin-guide/dependencies.md
  - Developer Guide:
    - developer-guide/index.md
    - Dev shell: developer-guide/dev-shell.md
    - Build: developer-guide/build.md
    - Architecture: developer-guide/architecture.md
    - Capture pipelines: developer-guide/capture-pipelines.md
    - C++ API reference: developer-guide/api.md
    - Contributing: developer-guide/contributing.md
  - About:
    - about/index.md
    - Changelog: about/changelog.md
    - License: about/license.md
    - Sponsors: about/sponsors.md
